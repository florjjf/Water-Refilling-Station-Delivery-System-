<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deliveries · AguaVita</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="app">

  <!-- paste SIDEBAR here (Deliveries link = class="active") -->

  <div class="main">
    <!-- paste TOPBAR here -->

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Deliveries</h1>
          <p class="sub">Schedule deliveries, assign riders, and follow order progress.</p>
        </div>
        <div class="actions">
          <button class="btn-outline" id="dateBtn"></button>
          <input type="date" id="dateInput" hidden>
          <button class="btn" id="assignBtn">+ Assign delivery</button>
        </div>
      </div>

      <section class="stats">
        <article class="card stat"><div><span>Scheduled today</span><b id="dTotal">–</b><small class="link-s" id="dRoutes"></small></div></article>
        <article class="card stat"><div><span>Awaiting dispatch</span><b id="dPending">–</b><small class="link-s">Assign a rider to continue</small></div></article>
        <article class="card stat"><div><span>On the road</span><b id="dRoute">–</b><small class="link-s" id="dRiders"></small></div></article>
        <article class="card stat"><div><span>Completed</span><b id="dDone">–</b><small class="link-s" id="dPct"></small></div></article>
      </section>

      <div class="toolbar">
        <div class="chips" id="chips">
          <button class="chip on" data-f="all">All deliveries</button>
          <button class="chip" data-f="Pending">Pending</button>
          <button class="chip" data-f="On route">On route</button>
          <button class="chip" data-f="Delivered">Delivered</button>
        </div>
        <div class="toolbar-right">
          <input id="q" class="plain" type="search" placeholder="Search order or rider">
          <button class="btn-outline">Filter</button>
        </div>
      </div>

      <section class="card flush">
        <h3 class="pad">Delivery schedule</h3>
        <div class="table-wrap">
          <table class="roomy">
            <thead><tr><th>Delivery / order</th><th>Customer / destination</th><th>Rider</th><th>Schedule</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pager">
          <small id="showing"></small>
          <div><button class="btn-outline" id="prev">Previous</button>
               <span class="pg" id="pg">1</span>
               <button class="btn-outline" id="next">Next</button></div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Assign rider modal -->
<dialog id="dlg">
  <form id="assignForm" method="dialog">
    <h3>Assign delivery</h3>
    <label>Order awaiting a rider
      <select id="orderSel" required></select>
    </label>
    <label>Rider
      <select id="riderSel" required></select>
    </label>
    <label>Route
      <select id="routeSel" required></select>
    </label>
    <label>Schedule
      <input type="time" id="timeInp" required>
    </label>
    <p id="formErr" class="err" hidden></p>
    <div class="actions end">
      <button type="button" class="btn-outline" id="cancel">Cancel</button>
      <button class="btn" type="submit">Assign</button>
    </div>
  </form>
</dialog>

<script src="js/layout.js"></script>
<script src="js/deliveries.js"></script>
</body>
</html>
